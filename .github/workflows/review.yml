name: PR Code Review with LLM

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

jobs:
  fetch-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get modified files with line numbers and code chunks
        id: modified_files
        run: |
          BASE_REF=${{ github.event.before }}
          HEAD_REF=${{ github.sha }}

          if [ -z "$BASE_REF" ]; then
            echo "Base commit (before) is not available. Using the default branch as the base."
            BASE_REF=$(git rev-parse origin/main)
          fi

          MODIFIED_FILES=$(git diff --name-only $BASE_REF $HEAD_REF)
          if [ -z "$MODIFIED_FILES" ]; then
            echo "No modified files found."
            exit 0
          fi

          for file in $MODIFIED_FILES; do
            CHUNKS=$(git diff -U0 $BASE_REF $HEAD_REF -- $file | grep "^@@" | sed 's/@@ //g' | awk '{print $1, $2}')
            while IFS= read -r chunk; do
              LINE_RANGE=$(echo $chunk | awk '{print $2}' | sed 's/,/-/' | sed 's/+//')
              CODE_CHUNK=$(git diff -U0 $BASE_REF $HEAD_REF -- $file | sed -n "/@@ $chunk @@/,/^@@/p" | grep "^+")
              echo "fileName:$file"
              echo "lineNo. range:$LINE_RANGE"
              echo "code chunk:"
              echo "$CODE_CHUNK"
            done <<< "$CHUNKS"
          done

      - name: Fetch entire files with modifications
        id: entire_files
        run: |
          BASE_REF=${{ github.event.before }}
          HEAD_REF=${{ github.sha }}

          if [ -z "$BASE_REF" ]; then
            BASE_REF=$(git rev-parse origin/main)
          fi

          MODIFIED_FILES=$(git diff --name-only $BASE_REF $HEAD_REF)
          if [ -z "$MODIFIED_FILES" ]; then
            echo "No modified files to fetch."
            exit 0
          fi

          for file in $MODIFIED_FILES; do
            echo "Fetching full content of file: $file"
            cat $file
          done

      - name: Pass data to Python script
        id: process_data
        run: |
          {
            echo "Modified files and chunks from diff:";
            echo "===============================";
            echo "Modified files with line numbers and code chunks:";
            BASE_REF=${{ github.event.before }}
            HEAD_REF=${{ github.sha }}

            if [ -z "$BASE_REF" ]; then
              BASE_REF=$(git rev-parse origin/main)
            fi

            MODIFIED_FILES=$(git diff --name-only $BASE_REF $HEAD_REF)
            if [ -z "$MODIFIED_FILES" ]; then
              exit 0
            fi

            for file in $MODIFIED_FILES; do
              CHUNKS=$(git diff -U0 $BASE_REF $HEAD_REF -- $file | grep "^@@" | sed 's/@@ //g' | awk '{print $1, $2}')
              while IFS= read -r chunk; do
                LINE_RANGE=$(echo $chunk | awk '{print $2}' | sed 's/,/-/' | sed 's/+//')
                CODE_CHUNK=$(git diff -U0 $BASE_REF $HEAD_REF -- $file | sed -n "/@@ $chunk @@/,/^@@/p" | grep "^+")
                echo "fileName:$file"
                echo "lineNo. range:$LINE_RANGE"
                echo "code chunk:"
                echo "$CODE_CHUNK"
                echo "code chunk: $CODE_CHUNK"
              done <<< "$CHUNKS"
            done

            echo "===============================";
            echo "Entire modified files for context:";
            for file in $MODIFIED_FILES; do
              echo "Fetching full content of file: $file"
              cat $file
            done
          } | python3 .github/scripts/process_modified_files.py

        env:
          GITHUB_EVENT_BEFORE: "${{ github.event.before }}"
          GITHUB_SHA: "${{ github.sha }}"
