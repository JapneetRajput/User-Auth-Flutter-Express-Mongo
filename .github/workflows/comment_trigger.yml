name: PR Review Comment Listener

on:
  pull_request_review_comment:
    types: [created]

jobs:
  process-review-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq PyGithub

      - name: Process PR Review Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          python .github/scripts/ProcessComment.py

      - name: Commit and Push if changes exist
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git checkout ${{ github.event.pull_request.head.ref }}
      
          git add .github/guidelines/guidelines.json
          git commit -m "Ensure guidelines file exists" || echo "No changes to commit"
          git push